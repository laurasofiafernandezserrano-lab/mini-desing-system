<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Design System</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link 
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Roboto:wght@700&display=swap" 
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <h1>Mini Design System</h1>
      <p>Mi primer sistema visual para interfaces.</p>
    </header>

      <section>
      <h2>Colores</h2>
      <div class="colors">
        <div class="color-card primary">
          <p>Primary</p>
          <span>#252A52</span>
        </div>
        <div class="color-card accent">
          <p>Accent</p>
          <span>#E47126</span>
        </div>
        <div class="color-card light">
          <p>Background</p>
          <span>#F3F4F6</span>
        </div>
      </div>
    </section>

      <section>
      <h2>Tipografía</h2>
      <h1 class="title-example">Ejemplo de Encabezado </h1>
      <p class="body-example">
        Este es el ejemplo de un párrafo usando la fuente secundaria .
      </p>
      <small>Ejemplo de texto pequeño</small>
    </section>


    <section>
      <h2>Componente Botón</h2>
      <button class="btn">haz clic aqui bb</button>
    </section>
  </body>
</html>
